# Cuts a release from a version tag.
#
# Attaches two things: the Compile Pal plugin folder as a zip, and the bare executable for anyone
# using Meshwright from a command line or a build script. Both are the same self-contained build, so
# neither needs .NET installed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # One version, from the tag when there is one and from the input otherwise, checked before
      # anything is built so a typo fails in a second rather than after a publish.
      #
      # Read through the environment rather than substituted into the script text. A tag name and a
      # dispatch input are both things a person types, and ${{ }} pastes them in before PowerShell
      # ever sees the file, so a tag with a quote in it would be running as part of this step.
      - name: Work out the version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_VERSION
          } else {
            $env:REF_NAME -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "not a version: '$version'. Expected something like 1.2.0"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version"

      # A release that fails its own tests is worse than no release.
      - name: Test
        run: dotnet test Meshwright.slnx --configuration Release -warnaserror

      # Past this point the version has been through the regex above, so it is safe to interpolate.
      # Kept in the environment anyway so there is one habit here rather than two.
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build-plugin.ps1 -Zip -Version $env:VERSION

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" `
            'artifacts/Meshwright-plugin.zip' `
            'artifacts/Meshwright/meshwright.exe' `
            --title "Meshwright $env:VERSION" `
            --generate-notes
